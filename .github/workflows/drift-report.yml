#
# The live half of the probe, kept separate from CI on purpose: an upstream
# outage must not turn a pull request red. This job publishes the drift report
# as an artifact and a run summary, and only fails if the probe itself crashes —
# a degraded report (status: null, errors populated) is a valid, expected result.
name: Origin drift report

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual check'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe product and proof origins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the probe
        run: |
          set -euo pipefail
          python probe.py | tee drift-report.json

      - name: Assert the report is well-formed and uncertified
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          r = json.load(open("drift-report.json"))
          assert r["schema"] == "szl.origin-drift/v1", r.get("schema")
          assert r["certified_production_ready"] is False, "probe emitted a production certificate"
          for key in ("product_honest", "product_readyz", "proof_health", "errors"):
              assert key in r, f"missing section: {key}"
          print("Report well-formed and uncertified.")
          PY

      - name: Publish the report to the run summary
        if: always()
        run: |
          {
            echo "### Origin drift report"
            echo ""
            echo '```json'
            cat drift-report.json 2>/dev/null || echo '{"error":"probe produced no output"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-report-${{ github.run_id }}
          path: drift-report.json
          if-no-files-found: warn
          retention-days: 90
