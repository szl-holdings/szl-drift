#
# The live half of the probe, kept separate from CI on purpose: an upstream
# outage must not turn a pull request red. This job always publishes the drift
# report (a degraded report with status: null and errors populated is a valid
# result), then runs the availability verdict last: the scheduled run turns red
# when any probed origin did not answer HTTP 200, so an outage alerts instead of
# being archived as a green artifact.
name: Origin drift report

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual check'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe product and proof origins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the probe
        run: |
          set -euo pipefail
          python probe.py | tee drift-report.json

      - name: Assert the report is well-formed and uncertified
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          r = json.load(open("drift-report.json"))
          assert r["schema"] == "szl.origin-drift/v1", r.get("schema")
          assert r["certified_production_ready"] is False, "probe emitted a production certificate"
          for key in ("product_honest", "product_readyz", "proof_health", "errors"):
              assert key in r, f"missing section: {key}"
          print("Report well-formed and uncertified.")
          PY

      - name: Publish the report to the run summary
        if: always()
        run: |
          {
            echo "### Origin drift report"
            echo ""
            echo '```json'
            cat drift-report.json 2>/dev/null || echo '{"error":"probe produced no output"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-report-${{ github.run_id }}
          path: drift-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the scheduled run when an origin is unavailable
        run: python verdict.py drift-report.json
